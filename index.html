<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Weather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🌤️ Real-Time Weather</h1>
        <p>Check the current weather of any city</p>
    </header>

    <main>
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name">
            <button onclick="getWeather()">Search</button>
        </div>

        <p id="message"></p>

        <section class="weather-card">
            <h2 id="city">Search for a city</h2>

            <div id="weatherIcon" class="weather-icon">🌤️</div>

            <div id="temperature" class="temperature">--°C</div>
            <p id="condition">Weather information will appear here</p>

            <div class="details">
                <div class="detail">
                    <span>💧</span>
                    <h3>Humidity</h3>
                    <p id="humidity">--%</p>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <h3>Wind</h3>
                    <p id="wind">-- km/h</p>
                </div>
            </div>

            <div class="time-box">
                <h3>🕒 Local Time</h3>
                <p id="currentTime">--:--:--</p>
                <small id="date">--</small>
            </div>

            <p class="updated" id="updated">No weather data yet</p>
        </section>
    </main>

    <footer>
        <p>Weather data powered by Open-Meteo</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
